<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PurrSafe — Final CTA</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../styles/components.css">
<style>
  body { margin:0; background:var(--ps-canvas); color:var(--ps-ink); font:var(--ps-body); -webkit-font-smoothing:antialiased; }
  .pv-note { padding: var(--ps-5) var(--ps-gutter); font: var(--ps-small); color: var(--ps-ink-muted); border-top: 1px solid var(--ps-border-cool); }
  .pv-note b { color: var(--ps-ink); }
  .pv-note code { color: var(--ps-teal); font-weight:700; }
</style>
</head>
<body>
<section id="get" class="band--surface">
    <div class="wrap">
      <div class="cta-panel">
        <span class="eyebrow">Private beta</span>
        <h2>Start her archive today</h2>
        <p class="lead" style="margin-inline:auto">
          Leave your email and we&rsquo;ll send an invite as soon as a slot opens.
        </p>
        <form class="waitlist" action="#" method="post">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" inputmode="email"
                 autocomplete="email" required placeholder="you@example.com">
          <button class="btn btn--primary" type="submit">Get the app</button>
        </form>
        <p class="meta">No spam. One email when your invite is ready.</p>
      </div>
    </div>
  </section>
<p class="pv-note">White band, centred clay panel. One field, one button, one promise about what the email is for.</p>
</body>
</html>
